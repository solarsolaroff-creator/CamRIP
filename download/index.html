<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CamRIP — скачать</title>
  <style>
    :root{--bg:#0f1117;--surface:#191c24;--surface2:#232733;--text:#e8eaf2;--muted:#a8afbf;--primary:#b8c4ff;--radius:24px}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#2a2f52,transparent),var(--bg);color:var(--text);line-height:1.5}
    .wrap{max-width:760px;margin:0 auto;padding:24px} .hero{padding:40px 0 16px} .badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#ffffff12;color:var(--primary);font-size:14px;margin-bottom:16px}
    h1{font-size:clamp(40px,8vw,64px);line-height:1.05;margin:0 0 12px} .lead{color:var(--muted);margin:0 0 24px;font-size:18px}
    .panel{background:var(--surface);border:1px solid #ffffff10;border-radius:28px;padding:24px;margin:20px 0}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:999px;text-decoration:none;font-weight:700;border:0;cursor:pointer;font-size:16px}
    .primary{background:var(--primary);color:#18204a} .primary[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
    .muted{color:var(--muted);font-size:14px} code{background:#ffffff10;padding:2px 7px;border-radius:8px}
  </style>
  <!-- Veriq: замени YOUR_VERIQ_BASE_URL на реальный базовый URL капчи -->
  <link rel="stylesheet" href="https://YOUR_VERIQ_BASE_URL/static/widget.css">
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="badge">Android • Material 3</div>
      <h1>CamRIP</h1>
      <p class="lead">Локальный видеоредактор для Android. Перед скачиванием пройди проверку.</p>
    </section>

    <section class="panel">
      <h2 style="margin-top:0">Проверка</h2>
      <div class="mycaptcha-widget" data-sitekey="pk_64LZV7SaqIeu_emlDtD4hg" data-base="https://YOUR_VERIQ_BASE_URL"></div>
      <p class="muted" style="margin:14px 0 0">После проверки кнопка скачивания станет активной.</p>
    </section>

    <section class="panel">
      <h2 style="margin-top:0">Скачать APK</h2>
      <a id="downloadBtn" class="btn primary" href="./apk/CamRIP.apk" download aria-disabled="true">Скачать CamRIP.apk</a>
      <p class="muted" style="margin:14px 0 0">Файл должен лежать в папке <code>apk/CamRIP.apk</code> рядом с этим сайтом.</p>
    </section>
  </div>

  <script src="https://YOUR_VERIQ_BASE_URL/widget.js"></script>
  <script>
    const btn = document.getElementById('downloadBtn');
    function checkToken() {
      const token = document.querySelector('input[name="mycaptcha_token"]');
      const ok = !!(token && token.value && token.value.trim().length > 0);
      btn.setAttribute('aria-disabled', ok ? 'false' : 'true');
    }
    setInterval(checkToken, 500);
    document.addEventListener('change', checkToken);
    document.addEventListener('input', checkToken);
    btn.addEventListener('click', (e) => { if (btn.getAttribute('aria-disabled') === 'true') e.preventDefault(); });
  </script>
</body>
</html>
