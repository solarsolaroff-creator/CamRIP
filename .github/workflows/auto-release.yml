name: Auto release

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
    - cron: '0 9 * * 6'   # Saturday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version
        id: bump
        run: |
          python3 - <<'PY'
          import re, pathlib, datetime
          p = pathlib.Path('app/build.gradle.kts')
          s = p.read_text()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', s).group(1))
          name = re.search(r'versionName\s*=\s*"([^"]+)"', s).group(1)
          parts = name.split('.')
          while len(parts) < 3: parts.append('0')
          parts[-1] = str(int(parts[-1]) + 1)
          new_name = '.'.join(parts)
          new_code = code + 1
          s = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{new_name}"', s, count=1)
          p.write_text(s)
          cl = pathlib.Path('CHANGELOG.md')
          if cl.exists():
            old = cl.read_text()
            today = datetime.date.today().isoformat()
            entry = f"## v{new_name}\n- Автоматическое плановое обновление.\n- Техническое обслуживание и подготовка релиза.\n\n"
            if old.startswith('# Changelog'):
              old = old.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
            else:
              old = entry + old
            cl.write_text(old)
          pathlib.Path('/tmp/ver.txt').write_text(f'name={new_name}\ncode={new_code}\n')
          print(f'Bumped to {new_name} ({new_code})')
          PY
          cat /tmp/ver.txt >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore(release): v${{ steps.bump.outputs.name }}"
          git tag -a "v${{ steps.bump.outputs.name }}" -m "CamRIP v${{ steps.bump.outputs.name }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.name }}"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/CamRIP-v${{ steps.bump.outputs.name }}-${{ steps.bump.outputs.code }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamRIP-v${{ steps.bump.outputs.name }}-debug
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.name }}
          name: v${{ steps.bump.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
