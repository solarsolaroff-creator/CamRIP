name: AI autopilot (template)

on:
  schedule:
    - cron: '0 10 * * 1'   # Monday 10:00 UTC
    - cron: '0 10 * * 6'   # Saturday 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AI secret
        id: check
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AI_API_KEY secret is not set. Add repository secret AI_API_KEY to enable AI autopilot."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run AI autopilot
        if: steps.check.outputs.configured == 'true'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4.1-mini' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # This template uses OpenCode CLI. Configure secrets/vars before enabling:
          # - Secret: AI_API_KEY (required)
          # - Variable: AI_MODEL (optional, provider/model)
          # - Secret for provider auth as required by your model/provider.
          npm i -g opencode-ai
          opencode run "Ты работаешь в репозитории CamRIP. Сделай небольшое безопасное улучшение, обнови CHANGELOG и версию (patch bump), затем подготовь изменения. Не ломай сборку." || true

      - name: Create PR with changes
        if: steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No changes produced by AI autopilot."
            exit 0
          fi
          BRANCH="ai-autopilot/$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(ai): scheduled autopilot update"
          git push origin "$BRANCH"
          gh pr create --fill --base main --head "$BRANCH" || true
