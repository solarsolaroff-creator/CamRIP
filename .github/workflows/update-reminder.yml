name: Update reminder

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
    - cron: '0 9 * * 6'   # Saturday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create update reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Scheduled update reminder (${new Date().toISOString().slice(0,10)})`;
            const body = [
              'Автоматическое напоминание: пора сделать следующее обновление CamRIP.',
              '',
              'Чеклист:',
              '- [ ] Проверить баги и UX',
              '- [ ] Внести улучшения',
              '- [ ] Поднять versionCode/versionName',
              '- [ ] Обновить CHANGELOG/README при необходимости',
              '- [ ] Создать тег `vX.Y.Z` и запушить (CI соберёт APK и добавит в Release)',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'update-reminder',
              per_page: 1,
            });
            if (issues.length > 0) {
              core.info('Open update-reminder issue already exists, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['update-reminder'],
            });
